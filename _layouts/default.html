<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.title }}">
  <link rel="canonical" href="{{ site.url }}/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <!-- Everything below is served from this site itself: no Google or other
       third-party resources, so the page loads normally from China. -->
  <link rel="preload" href="/assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/lora.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="#top">{{ site.title }}</a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#research">Research</a>
      <a href="#teaching">Teaching</a>
      <a href="{{ site.cv }}">CV</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <header id="top" class="intro">
    <div class="intro-body">
      <h1>{{ site.title }}</h1>
      <p class="intro-text">{{ site.position }}<br>{{ site.institution }}</p>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    &copy; {{ site.time | date: "%Y" }} {{ site.title }}
  </footer>

</body>
</html>
